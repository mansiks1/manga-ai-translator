<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Search AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="container">
        <h1>Manga Search AI</h1>

        <!--
        АККАУНТ И БАЛАНС
        Backend создает анонимного пользователя по HttpOnly cookie, а регистрация
        привязывает к нему email и пароль без потери накопленных credits.
        -->
        <section id="accountBar" class="account-bar" aria-label="Баланс аккаунта">
            <div class="account-identity">
                <span id="accountIdentity">Гость</span>
                <button id="openAuthButton" class="account-command" type="button">Войти</button>
                <button id="logoutButton" class="account-command" type="button" hidden>Выйти</button>
            </div>
            <div class="account-balance">
                <span>Кредиты</span>
                <strong id="creditBalance">...</strong>
                <span id="deepSearchPrice" class="deep-search-price"></span>
            </div>
            <button id="addCreditsButton" class="dev-credit-button" type="button" hidden></button>
            <span id="creditActivity" class="credit-activity" aria-live="polite"></span>
        </section>

        <!-- 
        БЛОК ПОИСКА
         -->
        <div id="searchbox">
            <input type="text" id="searchInput" placeholder="Введите название манги">
            <button id="searchButton" class="search-action" type="button">Найти</button>
            <button id="deepSearchButton" class="search-action secondary" type="button" disabled>Глубокий поиск</button>
        </div>

        <!--
        ПРЕДПОЧТИТЕЛЬНЫЙ ЯЗЫК ПЕРЕВОДА
        Сейчас влияет на поиск последней главы в MangaDex и позже будет использоваться для ИИ-перевода.
        -->
        <div id="languageSelector" class="language-selector" aria-label="Предпочтительный язык перевода">
            <span class="language-label">Перевод:</span>
            <button class="language-option active" type="button" data-language="ru">RU</button>
            <button class="language-option" type="button" data-language="en">EN</button>
            <button class="language-option" type="button" data-language="ja">JA</button>
            <button class="language-option" type="button" data-language="ko">KO</button>
            <button class="language-option" type="button" data-language="zh">ZH</button>
            <button class="language-option" type="button" data-language="">Все</button>
        </div>
        
        <!--
        БЛОК РЕЗУЛЬТАТОВ
        Изначально скрыт. JS показывает его, когда начинается поиск или приходят результаты.
        -->
        <section id="results" class="results" style="display: none;">
            <h2 id="searchStatus"></h2>
            <!-- Контейнер для карточек манги, которые создаются в script.js -->
            <div id="resultslist" class="resultslist"></div>
        </section>
    </main>

    <dialog id="authDialog" class="auth-dialog" aria-labelledby="authTitle">
        <div class="auth-dialog-header">
            <h2 id="authTitle">Вход</h2>
            <button id="closeAuthButton" class="icon-button" type="button" aria-label="Закрыть" title="Закрыть">×</button>
        </div>

        <div class="auth-mode" role="tablist" aria-label="Режим авторизации">
            <button id="loginModeButton" class="auth-mode-button active" type="button" role="tab" aria-selected="true">
                Вход
            </button>
            <button id="registerModeButton" class="auth-mode-button" type="button" role="tab" aria-selected="false">
                Регистрация
            </button>
        </div>

        <form id="authForm" class="auth-form">
            <label for="authEmail">Email</label>
            <input id="authEmail" name="email" type="email" autocomplete="email" maxlength="254" required>

            <label for="authPassword">Пароль</label>
            <input id="authPassword" name="password" type="password" autocomplete="current-password"
                minlength="15" maxlength="128" required>
            <span id="passwordHint" class="password-hint" hidden>Минимум 15 символов</span>

            <label id="authPasswordConfirmLabel" for="authPasswordConfirm" hidden>Повтори пароль</label>
            <input id="authPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password"
                minlength="15" maxlength="128" hidden>

            <p id="authError" class="auth-error" aria-live="polite"></p>
            <button id="authSubmitButton" class="auth-submit" type="submit">Войти</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
